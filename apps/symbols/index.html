<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Značky IEC 60617</title>
<meta name="description" content="526 značek z tabulek IEC 60617, dvojjazyčně CZ/EN, ke stažení jako SVG nebo PNG. IEC 60617 electrical symbols with SVG/PNG download.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⚡</text></svg>">
</head>
<body>
<header class="top">
  <div class="bar">
    <h1 data-i18n="title">Značky IEC 60617</h1>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="cs" class="on">CZ</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
  <div class="bar">
    <input id="q" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="search"
           placeholder="Hledat značku…" aria-label="Search">
    <button type="button" id="clear" hidden aria-label="clear">✕</button>
  </div>
  <nav id="cats" class="cats" aria-label="Categories"></nav>
</header>

<main>
  <p id="count" class="count" role="status"></p>
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden data-i18n="empty">Nic nenalezeno.</p>
</main>

<footer>
  <p data-i18n="note"></p>
</footer>

<script src="app.js"></script>
</body>
</html>
